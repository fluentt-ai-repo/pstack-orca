name: sync-upstream

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin upstream:upstream
      - id: before
        run: echo "sha=$(git rev-parse upstream)" >> "$GITHUB_OUTPUT"
      - id: sync
        run: echo "commit=$(scripts/sync-upstream.sh)" >> "$GITHUB_OUTPUT"
      - if: steps.sync.outputs.commit != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push origin upstream
          node scripts/upstream-report.mjs "${{ steps.before.outputs.sha }}" upstream > report.md
          gh label create upstream --description "Cursor changed pstack" --color 1d76db 2>/dev/null || true
          gh issue create --label upstream \
            --title "Cursor changed pstack: ${{ steps.sync.outputs.commit }}" \
            --body-file report.md
