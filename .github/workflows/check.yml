name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every orca command we reference exists in the snapshotted Orca
        run: node scripts/check-orca-commands.mjs
      - name: Hand-rewritten skills carry no Cursor wording
        run: node scripts/lint-rewritten.mjs
      - name: CURSOR-DEPENDENCIES.md holds no row for a rewritten path and its counts are current
        run: node scripts/prune-cursor-deps.mjs --check
      - uses: oven-sh/setup-bun@v2
      - name: The bundled scripts pass their tests
        run: cd skills/poteto-mode/scripts && bun install --frozen-lockfile && bun run test
